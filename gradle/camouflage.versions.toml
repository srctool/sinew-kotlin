# Camouflage's released version, from Maven Central. The dependencies on it are in sinew-camouflage (core) and the sample (skin).
[versions]
camouflage = "0.1.0"

[libraries]
core = { module = "com.srctool.camouflage:camouflage-core", version.ref = "camouflage" }
skin-minimal = { module = "com.srctool.camouflage:camouflage-skin-minimal", version.ref = "camouflage" }

[versions]
ktor = "3.6.0"
okhttp = "5.5.0"                  # the version ktor-client-okhttp brings; tests only

[libraries]
client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

name: CI

# Sinew for Kotlin: tests, ABI and the dependency-graph check on every pull request (see the docs: Testing and CI).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository; artifact uploads don't need the token.
permissions:
  contents: read

jobs:
  jvm-android:
    name: Check (JVM, Android host tests, graph)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew jvmTest testAndroidHostTest checkSinewGraph checkDevtoolsNoopAbi dokkaGenerate :sample:docs:test :sample:androidApp:assembleStagingDebug :sample:androidApp:assembleProductionRelease
      - name: Keep the devtools screenshots
        # References are per OS; a test records the ones this OS lacks, so the Linux set can be committed from here.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devtools-screenshots-linux
          path: sinew-devtools-ui/screenshots/linux
          if-no-files-found: ignore

  web:
    name: wasmJs compile and browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # Browser tests run in headless Chrome through Karma; the ubuntu image ships Google Chrome.
      - run: ./gradlew compileKotlinWasmJs wasmJsBrowserTest
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-browser-test-reports
          path: '*/build/reports/tests/wasmJsBrowserTest/'

  ios:
    name: iOS simulator tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew iosSimulatorArm64Test
      - name: The sample's iOS app builds
        run: xcodebuild -project sample/iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build

  devtools-gating:
    name: Devtools gating (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Proof that production builds carry no devtools code (see the docs: DevTools, Gating). The production outputs may
    # hold only what sinew-devtools-noop declares; the real-devtools builds (the Android staging release, and the rest
    # with -Psinew.devtools=true) must hold more, which shows the search can see devtools code.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Android, desktop, web', os: ubuntu-24.04, tasks: checkDevToolsGating, real: checkDevToolsGatingDesktop checkDevToolsGatingWeb }
          - { name: iOS, os: macos-15, tasks: checkDevToolsGatingIos, real: checkDevToolsGatingIos }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Production builds hold only the no-op
        run: ./gradlew ${{ matrix.tasks }}
      - name: Real-devtools builds hold the real devtools
        run: ./gradlew -Psinew.devtools=true ${{ matrix.real }}

  publish-check:
    name: Publish check (Maven Local, consumer)
    runs-on: macos-15
    timeout-minutes: 60
    # Every module and the BOM publish to Maven Local, and a separate project that depends on the BOM alone compiles
    # against them on Android, iOS, the JVM and wasm (tool/verify-publish.sh). Nothing is published anywhere.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: tool/verify-publish.sh 0.0.0-ci

  android-device:
    name: Android device tests (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The instrumented tests that need a real Android runtime: FieldCipher on the Keystore (and a lost master key),
    # SecureStore and Android's SQLite errors, and the network checker following Wi-Fi and data. The biometric vault
    # tests skip themselves here: they need an enrolled fingerprint and touches, run by tool/android-biometric-test.sh.
    # The sample's list screen runs its full cycle here too.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the test APKs before the emulator starts
        run: ./gradlew :sinew-security:assembleAndroidDeviceTest :sinew-storage:assembleAndroidDeviceTest :sinew-network:assembleAndroidDeviceTest :sample:androidApp:assembleStagingDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: ./gradlew :sinew-security:connectedAndroidDeviceTest :sinew-storage:connectedAndroidDeviceTest :sinew-network:connectedAndroidDeviceTest :sample:androidApp:connectedStagingDebugAndroidTest
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-reports
          path: '*/build/reports/androidTests/'

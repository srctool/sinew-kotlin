name: CI

# Sinew for Kotlin: tests, ABI and the dependency-graph check on every pull request (see the docs: Testing and CI).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    name: Check (JVM, Android host tests, graph)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew jvmTest testAndroidHostTest checkSinewGraph :sample:androidApp:assembleStagingDebug

  web:
    name: wasmJs compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew compileKotlinWasmJs

  ios:
    name: iOS simulator tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew iosSimulatorArm64Test

  android-device:
    name: Android device tests (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The instrumented tests that need a real Android runtime: FieldCipher on the Keystore (and a lost master key),
    # SecureStore and Android's SQLite errors, and the network checker following Wi-Fi and data. The biometric vault
    # tests skip themselves here: they need an enrolled fingerprint and touches, run by tool/android-biometric-test.sh.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the test APKs before the emulator starts
        run: ./gradlew :sinew-security:assembleAndroidDeviceTest :sinew-storage:assembleAndroidDeviceTest :sinew-network:assembleAndroidDeviceTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: ./gradlew :sinew-security:connectedAndroidDeviceTest :sinew-storage:connectedAndroidDeviceTest :sinew-network:connectedAndroidDeviceTest
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-reports
          path: '*/build/reports/androidTests/'

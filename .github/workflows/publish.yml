name: Publish to Maven Central

# Push a tag vX.Y.Z on main to publish com.srctool.sinew:* at version X.Y.Z:
#   git tag v0.1.0 && git push origin v0.1.0
# One macOS job publishes every module: the iOS artifacts need Xcode, and a single host
# avoids duplicate uploads to the Central Portal.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write # for the GitHub Release
  actions: read   # to read the CI run of the tagged commit

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    # Only the organization repository publishes; tags pushed to forks do nothing.
    if: github.repository == 'srctool/sinew-kotlin'
    runs-on: macos-15
    # Optional hardening: create a "maven-central" environment with required reviewers.
    environment: maven-central
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Tag the merge commit on main."
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The tagged commit must already be green: CI ran the whole suite when it landed on main, so the release doesn't run
      # it again. (Rerunning `check` here is what once blocked a Camouflage release that CI had already passed: a flake on
      # the macOS runner.) A red or still-running CI blocks the release before anything is uploaded.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --branch main \
            --json status,conclusion,url --jq '.[0] // empty')"
          if [[ -z "$run" ]]; then
            echo "::error::CI has not run on $GITHUB_SHA. Tag the commit CI ran on, on main."
            exit 1
          fi
          status="$(jq -r .status <<< "$run")"
          conclusion="$(jq -r .conclusion <<< "$run")"
          if [[ "$status" != completed || "$conclusion" != success ]]; then
            echo "::error::CI on $GITHUB_SHA is $status/$conclusion, not completed/success: $(jq -r .url <<< "$run"). Wait for it, or fix it, then tag."
            exit 1
          fi
          echo "CI passed on $GITHUB_SHA: $(jq -r .url <<< "$run")"

      # The API reference (Dokka HTML, one folder per module) travels with the release, so it needs no Pages setup.
      # Built before the publish on purpose: a failure here must not leave artifacts on Maven Central with no release.
      - name: Build the API reference
        run: |
          ./gradlew dokkaGenerate -PVERSION_NAME="$VERSION"
          mkdir -p api-docs
          for dir in sinew-*/build/dokka/html; do
            module="${dir%%/*}"
            mkdir -p "api-docs/$module" && cp -R "$dir"/. "api-docs/$module/"
          done
          zip -qr "sinew-kotlin-api-$VERSION.zip" api-docs

      - name: Publish and release on the Central Portal
        # Sinew takes its lockstep version from the VERSION_NAME Gradle property, so the tag decides the version.
        # A failed upload leaves an unreleased deployment: drop it in the portal and re-run; never bump
        # the version to "fix" a failed upload.
        run: ./gradlew publishAndReleaseToMavenCentral -PVERSION_NAME="$VERSION" --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: sinew-kotlin-api-${{ env.VERSION }}.zip

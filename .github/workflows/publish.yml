name: Publish to Maven Central

# Push a tag vX.Y.Z on main to publish com.srctool.sinew:* at version X.Y.Z:
#   git tag v0.1.0 && git push origin v0.1.0
# One macOS job publishes every module: the iOS artifacts need Xcode, and a single host
# avoids duplicate uploads to the Central Portal.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write # for the GitHub Release

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    # Only the organization repository publishes; tags pushed to forks do nothing.
    if: github.repository == 'srctool/sinew-kotlin'
    runs-on: macos-15
    # Optional hardening: create a "maven-central" environment with required reviewers.
    environment: maven-central
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Tag the merge commit on main."
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check
        run: ./gradlew check -PVERSION_NAME="$VERSION"

      # The API reference (Dokka HTML, one folder per module) travels with the release, so it needs no Pages setup.
      # Built before the publish on purpose: a failure here must not leave artifacts on Maven Central with no release.
      - name: Build the API reference
        run: |
          ./gradlew dokkaGenerate -PVERSION_NAME="$VERSION"
          mkdir -p api-docs
          for dir in sinew-*/build/dokka/html; do
            module="${dir%%/*}"
            mkdir -p "api-docs/$module" && cp -R "$dir"/. "api-docs/$module/"
          done
          zip -qr "sinew-kotlin-api-$VERSION.zip" api-docs

      - name: Publish and release on the Central Portal
        # Sinew takes its lockstep version from the VERSION_NAME Gradle property, so the tag decides the version.
        # A failed upload leaves an unreleased deployment: drop it in the portal and re-run; never bump
        # the version to "fix" a failed upload.
        run: ./gradlew publishAndReleaseToMavenCentral -PVERSION_NAME="$VERSION" --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: sinew-kotlin-api-${{ env.VERSION }}.zip
